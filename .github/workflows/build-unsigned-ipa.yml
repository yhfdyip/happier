name: BUILD — iOS Unsigned IPA

defaults:
  run:
    shell: bash

on:
  push:
    branches:
      - main
    paths:
      - 'apps/ui/**'
      - '.github/workflows/build-unsigned-ipa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-unsigned-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-unsigned-ipa:
    runs-on: macos-15
    timeout-minutes: 75
    env:
      NODE_VERSION: "22.x"
      APP_ENV: production
      COCOAPODS_DISABLE_STATS: "true"
      SPM_CACHE_PATH: ~/Library/Developer/Xcode/DerivedData/SourcePackages

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Verify Xcode version
        run: xcodebuild -version

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Enable Corepack (Yarn)
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Install dependencies
        env:
          YARN_PRODUCTION: "false"
          npm_config_production: "false"
        run: yarn install --frozen-lockfile --ignore-engines

      - name: Prebuild iOS project (Expo)
        run: |
          set -euo pipefail
          cd apps/ui
          rm -rf ios
          npx expo prebuild --platform ios --no-install --non-interactive

      - name: Ensure CocoaPods CLI
        run: |
          if ! command -v pod >/dev/null 2>&1; then
            gem install cocoapods --no-document
          fi
          pod --version

      - name: Cache CocoaPods download cache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-cocoapods-cache-${{ hashFiles('apps/ui/ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-cocoapods-cache-

      - name: Cache iOS Pods directory
        uses: actions/cache@v4
        with:
          path: apps/ui/ios/Pods
          key: ${{ runner.os }}-pods-dir-${{ hashFiles('apps/ui/ios/Podfile.lock') }}

      - name: Cache Swift Package Manager artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ${{ env.SPM_CACHE_PATH }}
          key: ${{ runner.os }}-spm-${{ hashFiles('apps/ui/ios/**/*.pbxproj', 'apps/ui/ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Install iOS Pods
        run: |
          set -euo pipefail
          cd apps/ui/ios
          LOG_FILE="$RUNNER_TEMP/pod-install.log"
          : > "$LOG_FILE"

          set +e

          pod install --deployment 2>&1 | tee -a "$LOG_FILE"
          status=${PIPESTATUS[0]}

          if [ "$status" -ne 0 ]; then
            echo "pod install --deployment failed, retrying without deployment..." | tee -a "$LOG_FILE"
            pod install 2>&1 | tee -a "$LOG_FILE"
            status=${PIPESTATUS[0]}
          fi

          if [ "$status" -ne 0 ]; then
            echo "pod install failed, trying pod repo update and clean Pods as last resort..." | tee -a "$LOG_FILE"
            pod repo update 2>&1 | tee -a "$LOG_FILE"
            rm -rf Pods
            pod install --repo-update 2>&1 | tee -a "$LOG_FILE"
            status=${PIPESTATUS[0]}
          fi

          if [ "$status" -ne 0 ]; then
            echo "Final pod install failure. Showing last 200 log lines:" | tee -a "$LOG_FILE"
            tail -n 200 "$LOG_FILE"
            exit "$status"
          fi

      - name: Upload Pod install log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pod-install-log
          path: ${{ runner.temp }}/pod-install.log
          if-no-files-found: warn
          retention-days: 7

      - name: Detect iOS workspace and scheme
        id: ios_meta
        run: |
          set -euo pipefail
          cd apps/ui/ios

          workspace_name="$(find . -maxdepth 1 -name '*.xcworkspace' -print | sed 's|^\./||' | head -n 1)"
          if [ -z "${workspace_name:-}" ]; then
            echo "No .xcworkspace found in apps/ui/ios" >&2
            exit 1
          fi

          scheme="$(xcodebuild -list -json -workspace "$workspace_name" | node -e '
            let data = "";
            process.stdin.on("data", (chunk) => {
              data += chunk;
            });
            process.stdin.on("end", () => {
              const parsed = JSON.parse(data);
              const schemes = parsed?.workspace?.schemes ?? [];
              if (!Array.isArray(schemes) || schemes.length === 0) {
                process.exit(2);
              }
              const preferred = schemes.find((name) => typeof name === "string" && !name.startsWith("Pods-"));
              process.stdout.write(String(preferred ?? schemes[0]));
            });
          ')"

          if [ -z "${scheme:-}" ]; then
            echo "No scheme found for workspace ${workspace_name}" >&2
            exit 1
          fi

          artifact_basename="$(echo "$scheme" | tr -cd '[:alnum:]._-')"
          if [ -z "${artifact_basename:-}" ]; then
            artifact_basename="happier"
          fi

          echo "workspace=${workspace_name}" >> "$GITHUB_OUTPUT"
          echo "scheme=${scheme}" >> "$GITHUB_OUTPUT"
          echo "artifact_basename=${artifact_basename}" >> "$GITHUB_OUTPUT"

      - name: Build iOS archive (unsigned)
        run: |
          set -euo pipefail
          cd apps/ui/ios
          mkdir -p "$SPM_CACHE_PATH"

          xcodebuild \
            -workspace "${{ steps.ios_meta.outputs.workspace }}" \
            -scheme "${{ steps.ios_meta.outputs.scheme }}" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/happier.xcarchive" \
            -clonedSourcePackagesDirPath "$SPM_CACHE_PATH" \
            -parallelizeTargets \
            -jobs "$(sysctl -n hw.ncpu)" \
            -showBuildTimingSummary \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$(find "$RUNNER_TEMP/happier.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "${APP_PATH:-}" ]; then
            echo "No .app was found in archive" >&2
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/"

          ipa_name="${{ steps.ios_meta.outputs.artifact_basename }}-unsigned.ipa"
          cd "$RUNNER_TEMP/ipa"
          zip -r -y "$GITHUB_WORKSPACE/$ipa_name" Payload

          echo "IPA_NAME=$ipa_name" >> "$GITHUB_ENV"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: happier-app-unsigned-ipa
          path: ${{ env.IPA_NAME }}
          if-no-files-found: error
          retention-days: 14
